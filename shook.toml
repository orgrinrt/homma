# What homma wants run at a git event, for a plain `git shook install` to
# register in a clone that has never run `homma hook install`: the release gate,
# which every push of a workspace goes through.
#
# Where homma is installed, `homma hook install <repo>` writes the same manifest
# into the git directory's `shook/manifests/` under the same name, beside a copy
# of the workspace's own git hooks manifest, and git-shook registers that one in
# place of this file, since a clone-local manifest replaces a tracked one of the
# same name. `git shook install` shows what each entry would run and registers
# them only once the operator agrees.

name = "homma"

[hooks.pre-push]
run = ["homma", "release", "gate", "--hook"]
