# What homma wants run at a git event, for `git shook install` to register.
#
# homma installs these itself today, into the common git directory's `hooks/`
# rather than into `core.hooksPath`, which is somebody else's directory. That
# was the one place every chain reached: git reads it where no hooks path is
# set, and mockspace's gate runs the repository's own hook there after its own
# checks. It reaches nothing where git-shook owns the path, because a
# dispatcher runs what the manifests declare and chains to nothing, so a
# manifest is how homma gets to the event at all in a repository that has
# adopted it.
#
# `homma hook run <event>` is the same entry point homma's own generated hook
# execs, and it reads `[hooks]` in `homma.toml` to decide what that event means,
# so this changes who calls it and nothing about what it does.
#
# Both entries are declared and neither is a decision about which one a given
# repository wants; `git shook install` shows what each would run and registers
# them only once the operator agrees.

name = "homma"

[hooks.pre-commit]
run = ["homma", "hook", "run", "pre-commit"]

[hooks.pre-push]
run = ["homma", "hook", "run", "pre-push"]
