[package]
name = "homma-core"
version = "0.0.0"
description = "Core library for homma: workspace management for multi-repo Rust workspaces."
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
mockspace-template = { git = "https://github.com/hiisi-digital/mockspace.git", branch = "dev" }
mockspace-config = { git = "https://github.com/hiisi-digital/mockspace.git", branch = "dev" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
gix = { version = "0.66", default-features = false, features = [
    "blocking-network-client",
    "blocking-http-transport-reqwest-rust-tls",
    "status",
    "worktree-mutation",
    "revision",
] }

[dev-dependencies]
tempfile = "3"
