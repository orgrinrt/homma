[package]
name = "homma-core"
version = "0.0.0"
description = "Core library for homma: workspace management for multi-repo Rust workspaces."
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
homma-api = { path = "../homma-api" }
# By revision, not by branch. A branch means the engine built from one pin is
# not the engine built from the same pin tomorrow, and `cargo install` ignores
# the committed lockfile, so nothing here holds it still. The launcher's build
# cache is keyed on this repository's own revision, so the drift lands silently:
# two operators on the identical pin run different code and neither can tell.
# Bumping this is a deliberate act, which is the point.
mockspace-template = { git = "https://github.com/hiisi-digital/mockspace.git", rev = "f1349b66c491a856cbe692f965d8dc86c07cd0e9" }
mockspace-config = { git = "https://github.com/hiisi-digital/mockspace.git", rev = "f1349b66c491a856cbe692f965d8dc86c07cd0e9" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
gix = { version = "0.87", default-features = false, features = [
    # The object hash, explicit since gix made it a feature rather than a
    # default. `sha1` is what git itself uses, so this is the pick that leaves
    # behaviour where it was; `sha256` would be a different repository format.
    "sha1",
    "blocking-network-client",
    "blocking-http-transport-reqwest-rust-tls",
    "status",
    "worktree-mutation",
    "revision",
] }

[dev-dependencies]
tempfile = "3"
