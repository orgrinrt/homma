[package]
name = "homma-org"
version = "0.0.0"
description = "The registry, the workspace lifecycle, and the generation pass"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
homma-api = { path = "../homma-api" }
# The same engine every `mock/*.md.tmpl` already renders through, so a rule
# author writes the templating they already know and the language's planned
# extensions arrive once for both.
mockspace-template = { git = "https://github.com/hiisi-digital/mockspace.git", branch = "dev" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
# For the seam test only. U-3.1's exit test says "a commit made in a
# **provisioned** workspace", and `provision` was exercised against a fake while
# the real `Git` was exercised directly, so the join between them was tested by
# nothing. A dev-dependency rather than a dependency: nothing in this crate's
# own code may reach a concrete git implementation.
homma-core = { path = "../homma-core" }
