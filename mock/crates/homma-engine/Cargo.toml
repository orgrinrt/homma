[package]
name = "homma-engine"
version = "0.0.0"
description = "Workspace management CLI for multi-repo Rust workspaces. Native git/forge ops, replaces gh-CLI usage."
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# `renki` is linked here for its extension api, and it declares 1.88, which is the engine's floor too.
rust-version = "1.88"
publish = false

# Named for the package rather than for the command. The command is `homma` and
# it belongs to the launcher, which resolves this engine and runs it.
[[bin]]
name = "homma-engine"
path = "src/main.rs"

[dependencies]
homma-core = { path = "../homma-core" }
homma-api = { path = "../homma-api" }
homma-store = { path = "../homma-store" }
homma-org = { path = "../homma-org" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
# A transcript stamps its lines in UTC and a capture is named for the local
# minute, which needs the system's time zone database.
jiff = "0.2"
toml = "0.8"
tempfile = "3"
# The version of the summarising pass's rules is their digest, which a cache of summaries keys on.
blake3 = "1"
# A hook's matcher in the settings `homma ask` reads is a regular expression, as the host reads it.
regex = "1"
# The index crate, through which `homma search` opens every index of the workspace and asks them as
# one. Turning `search` off leaves the verb and its code out of the build and nothing more: cargo
# resolves an optional git dependency whether its feature is on or not, so homma is publishable only
# once this crate is reachable by a public build.
muisti = { git = "ssh://git@github.com/orgrinrt/muisti", branch = "dev", default-features = false, optional = true }

# The host half of renki's extension api: a tool's descriptor is read, checked, located and run by
# `renki::extension`. `renki-dirs` and `notko` are what the cache root that api fetches into is read
# with, since `renki` keeps its own resolution of that root to itself. renki builds on unix only, and
# so the engine reaches all three there only; elsewhere the tools are refused.
[target.'cfg(unix)'.dependencies]
renki = "0.0.3"
renki-dirs = "0.0.1"
notko = { version = "0.0.1", default-features = false }
# A child the engine may have to end leads a process group, and the group is ended by a signal sent
# from homma, never by whatever `kill` is on `PATH`.
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
# The launcher, for the one list the readme test needs from it: which commands
# the launcher answers before the engine runs at all. Read off the launcher's
# descriptor rather than written down here, so a second launcher command cannot
# land without the engine's test knowing. The launcher dev-depends on
# `homma-core` the other way round for the same reason, and neither is built
# outside a test.
homma = { path = "../../../launcher" }

[features]
default = ["search"]
# `homma search`, one question across every index of the workspace.
search = ["dep:muisti"]
