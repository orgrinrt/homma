[[tenet]]
id = "an_identity_with_nothing_to_do_parks_and_is_woken_by_a_ping"
standing = "provisional"
what = "An identity is woken only while it is active and needed: after the third wake in a row with nothing to do it parks and messages the one who manages it, who wakes it by a ping when it is needed again."
because = '''Op, 23 November 2026, on what reaches an identity with no work this hour [options: its hand's fire only; an hourly task for every identity; a six-hourly task while parked]: "Hands fire only and ONLY if they remain active and needed. Let's say that after third consequent "nothing to do" wake, a hand parks and DMs coord to wake them by ping when they are needed again." Intent: an idle identity costs nothing; it stops waking itself after three empty wakes in a row and is brought back by a ping from the one it answers to.'''
reading = "He named a hand and its coordinator; the row reads it for any identity and the one who manages it."
sources = ["research::t202611231400_homma_canon_sources::sources::a_parked_identity"]
subject = "messaging"
keywords = ["park", "parked", "wake", "idle", "nothing to do", "ping", "lead", "three wakes"]
related = ["tenet::a_ping_addresses_a_handle_and_names_are_for_prose"]

