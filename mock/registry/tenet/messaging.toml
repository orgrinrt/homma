# The tenets whose subject is `messaging`.

[[tenet]]
id = "git_is_the_truth_of_the_channels_and_a_worker_is_optional"
standing = "provisional"
what = "The channels' only source of truth is git, and a worker that speeds them up can be added or dropped at any time, everything resuming from git without it."
because = '''Op, 23 November 2026, unprompted, on the messaging tool: "we can make improvements to existing msg that optionally uses the workers we have to speed things up or asynchronously manage the channels and such while source of truth always remains the git and a worker can be shut down and things still work via git in its absence, though slower or not as nice. And a worker can be added and dropped at will and everything syncs and stops and resumes seamlessly from/to the git state. The handles is what pings should default to, names, nick or proper, only used in prose if at all. Depends on personality I suppose. We'll want to improve the way attachments and such work too, so they don't just have a parallel place outside of the repos in question that should get reports in their mockspace for example, which had before been a bit of a problem. It needs a smart way to integrate with mockspaces and homma itself I think, and reuse as much as it can from them. Homma primarily in general and mocksoace as extra synergy level if one exists where worked." Intent: a worker holds nothing git does not; with it the channels are faster, without it they are slower and lose nothing.'''
sources = ["research::t202611231400_homma_canon_sources::sources::git_as_the_truth_of_the_channels"]
subject = "messaging"
keywords = ["git", "source of truth", "worker", "optional", "channel", "sync", "resume"]

[[tenet]]
id = "a_ping_addresses_a_handle_and_names_are_for_prose"
standing = "provisional"
what = "A ping addresses an identity by its handle, and a name, given or nick, is used in prose only, if at all."
because = '''Op, 23 November 2026, unprompted, on the messaging tool: "we can make improvements to existing msg that optionally uses the workers we have to speed things up or asynchronously manage the channels and such while source of truth always remains the git and a worker can be shut down and things still work via git in its absence, though slower or not as nice. And a worker can be added and dropped at will and everything syncs and stops and resumes seamlessly from/to the git state. The handles is what pings should default to, names, nick or proper, only used in prose if at all. Depends on personality I suppose. We'll want to improve the way attachments and such work too, so they don't just have a parallel place outside of the repos in question that should get reports in their mockspace for example, which had before been a bit of a problem. It needs a smart way to integrate with mockspaces and homma itself I think, and reuse as much as it can from them. Homma primarily in general and mocksoace as extra synergy level if one exists where worked." Op, 23 November 2026, on who may message whom [options: anyone, but a message across teams does not wake; anyone, and every message wakes; feudal, through one's lead]: "Option 3, feudal, is the etiquette. But option 2 is the de facto protocol, though discouraged to break retiquette". Intent: the handle is the address; anyone may message anyone and every message wakes its addressee, and going through one's lead is the etiquette the identities keep, breaking it discouraged and never refused.'''
sources = [
    "research::t202611231400_homma_canon_sources::sources::git_as_the_truth_of_the_channels",
    "research::t202611231400_homma_canon_sources::sources::addressing",
]
subject = "messaging"
keywords = ["ping", "handle", "address", "name", "nick", "feudal", "etiquette", "protocol", "wake", "direct message"]

[[tenet]]
