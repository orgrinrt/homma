because = '''Op, 23 November 2026, on where a channel lives [options: a sauna/<channel> branch in the workspace repository; keep coord/<channel>; a repository of its own]: "sauna/c/<ch>". Op, 23 November 2026, on whether a unit nests [options: yes, a project and its arcs, `kaski` and `kaski::render`, one channel branch per project with the arcs inside it; no, every arc a flat name with its own branch; only projects are units, an arc staying a team addressed through its hand]: "Nest (Recommended)". Intent: a channel is a branch named after its project, and the arcs of the project speak inside it, so one who follows a project fetches one branch.'''
