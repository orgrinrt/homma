[package]
name = "homma"
version = "0.0.0"
edition = "2024"
# The published crate, and the whole of what an operator installs. The engine
# (`homma-engine`) stays private: this launcher git-installs whatever engine the
# workspace pins, so it needs no version relationship to it.
publish = true
description = "Launcher for the homma workspace harness: resolves the engine a workspace pins, builds it once per version into a shared cache, and runs it from any working directory."
license = "MPL-2.0"
repository = "https://github.com/orgrinrt/homma"
categories = ["development-tools", "command-line-utilities"]
keywords = ["homma", "workspace", "multi-repo", "git"]

# The launcher machinery is `renki` and is shared with every other tool built
# the same way. What is left here is this tool's own, which is a descriptor and
# nothing else.
[dependencies]
# A `0.0.x` requirement is already the exact version and nothing else, which is
# what this wants: it is the launcher every operator installs, and it moves when
# the number here moves rather than when a branch does.
renki = "0.0.1"

# The engine's config type, so a test can hold both ends of the one file this
# tool and its engine share. Dev-only: the launcher itself never reads the
# config as anything but text, which is what keeps it engine-agnostic.
[dev-dependencies]
homma-core = { path = "../mock/crates/homma-core" }
tempfile = "3"
