# homma ,  the mockspace config.
#
# At the repo root rather than inside `mock/`: a repo has exactly one of these, and the root is
# where it belongs. `mock_dir` maps it to the workspace it governs.

# The engine pin. mockspace has cut no release yet, so this tracks the working trunk. The launcher
# re-resolves the branch head hourly.
mockspace_branch = "dev"

project_name = "homma"

# Files that only ever grow, so the append merge driver keeps both sides when two branches add to them.
append_only = [".homma/milestones.toml"]
crate_prefix = "homma"
abi_version = 1
mock_dir = "mock"

proc_macro_crates = []
module_crates = []

# Layer labels by depth index, settled by the taxonomy round.
layers = [
    "L0 contracts",
    "L1 mechanism",
    "L2 store",
    "L3 domain",
    "L4 service",
    "L5 surface",
]

[domain_kinds]

[known_macros]

[crate_colors]

# `mock search`: the one search over this repository, answered from its own index
# and never building it. The tool comes in on the same cdylib a lint pack would,
# from the pack's repository, alone and without the pack's lints.
[lint-crates]
mockspace-extra-search = { git = "ssh://git@github.com/orgrinrt/mockspace-extra-lints.git", branch = "dev" }

# The commit types this repository uses, beyond mockspace's defaults (feat, fix, refactor, docs,
# test, chore, bench, release). The builtin `commit-subject` gate refuses a type that is not listed, so a new
# type is added here and nowhere else.
[lints.commit-subject]
extra_types = "topic,src,doc,style"
