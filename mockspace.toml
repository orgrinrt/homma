# homma ,  the mockspace config.
#
# At the repo root rather than inside `mock/`: a repo has exactly one of these, and the root is
# where it belongs. `mock_dir` maps it to the workspace it governs.

# The engine pin. mockspace has cut no release yet, so this tracks the working trunk. The launcher
# re-resolves the branch head hourly.
mockspace_branch = "dev"

project_name = "homma"
crate_prefix = "homma"
abi_version = 1
mock_dir = "mock"

proc_macro_crates = []
module_crates = []

# Layer labels by depth index, settled by the taxonomy round.
layers = [
    "L0 contracts",
    "L1 mechanism",
    "L2 store",
    "L3 domain",
    "L4 service",
    "L5 surface",
]

[domain_kinds]

[known_macros]

[crate_colors]

# `mock ask <question...>`: a question against this mock dir, answered with
# the passages that clear. The tool lives in muisti's repository and comes in
# on the same cdylib a lint pack would; muisti is private, hence ssh.
[lint-crates]
ask = { git = "ssh://git@github.com/orgrinrt/muisti.git", branch = "dev" }
